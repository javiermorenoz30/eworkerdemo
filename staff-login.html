<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Acceso de equipo | eWorker360</title>
    <link rel="stylesheet" href="staff.css?v=supabase-1" />
  </head>
  <body>
    <header class="staff-header"><a class="staff-brand" href="index.html"><img src="assets/logoewrker.png" alt="eWorker360 Dominicana" /></a><span class="staff-tag">PORTAL DE EQUIPO</span></header>
    <main class="auth-shell">
      <section class="login-card">
        <p class="eyebrow">EWORKER360 / SOLICITUDES</p>
        <h1>Tu espacio de <em>reclutamiento.</em></h1>
        <p>Ingresa con el correo y contraseña de tu cuenta autorizada.</p>
        <form id="staff-login-form" class="login-form">
          <label>Correo<input name="email" type="email" autocomplete="email" required placeholder="nombre@empresa.com" /></label>
          <label>Contraseña<input name="password" type="password" required autocomplete="current-password" placeholder="Tu contraseña" /></label>
          <button class="primary" type="submit">Iniciar sesión</button>
          <button class="auth-link" id="forgot-password" type="button">¿Olvidaste tu contraseña?</button>
          <p class="login-note" id="login-note" aria-live="polite"></p>
        </form>
        <a class="back-link" href="index.html">← Volver al sitio público</a>
      </section>
    </main>
    <script type="module" src="auth.js?v=supabase-1"></script>
  </body>
</html>
