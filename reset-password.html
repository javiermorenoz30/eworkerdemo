<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Crear contraseña | eWorker360</title>
    <link rel="stylesheet" href="staff.css?v=supabase-1" />
  </head>
  <body>
    <header class="staff-header"><a class="staff-brand" href="index.html"><img src="assets/logoewrker.png" alt="eWorker360 Dominicana" /></a><span class="staff-tag">PORTAL DE EQUIPO</span></header>
    <main class="auth-shell">
      <section class="login-card">
        <p class="eyebrow">EWORKER360 / SEGURIDAD</p>
        <h1>Crea tu nueva <em>contraseña.</em></h1>
        <p>Usa al menos 8 caracteres. Esta pantalla sirve tanto para invitaciones nuevas como para recuperación de acceso.</p>
        <form id="reset-password-form" class="login-form">
          <label>Nueva contraseña<input name="password" type="password" minlength="8" autocomplete="new-password" required /></label>
          <label>Confirmar contraseña<input name="passwordConfirm" type="password" minlength="8" autocomplete="new-password" required /></label>
          <button class="primary" type="submit">Guardar contraseña</button>
          <p class="login-note" id="reset-password-note" aria-live="polite"></p>
        </form>
        <a class="back-link" href="staff-login.html">← Volver al acceso</a>
      </section>
    </main>
    <script type="module" src="reset-password.js?v=supabase-1"></script>
  </body>
</html>
