name: Patch index module script

on:
  push:
    branches: [supabase-production]
    paths:
      - '.github/workflows/patch-index-module.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supabase-production
      - name: Replace app script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="app.js?v=faq-static-1" defer></script>'
          new = '<script type="module" src="app.js?v=supabase-1"></script>'
          if old not in text:
              raise SystemExit('Expected app.js script tag was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: load landing app as Supabase module"
          git push origin HEAD:supabase-production
